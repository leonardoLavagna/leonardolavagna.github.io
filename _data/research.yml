    caption: Molecules, data, and possibilities for discovery.
applications:
  - name: Telecommunication networks
    description: Network design, routing, and resource allocation as settings for graph-based optimization and hybrid computational methods.
  - name: Electrical networks & energy management
    description: Planning and control of electrical networks, with optimization and predictive modelling for energy use, scheduling, and resource management.
  - name: Information engineering
    description: Signal processing, multivariate time-series modelling, anomaly detection, and the implementation of quantum-classical computational systems.
  - name: Satellite constellations
    description: Constellation design, connectivity, and coordination as large-scale optimization problems at the intersection of satellite systems and communication networks.
